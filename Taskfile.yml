version: "3"

vars:
  BINARY: donkey
  VERSION: '{{.VERSION | default "dev"}}'
  # Both binaries carry the version: the CLI prints it, and the server hands
  # it back on /v1/ping so a CLI can tell it is talking to a different one.
  LDFLAGS: >-
    -X github.com/adrianliechti/donkey/internal/cli.version={{.VERSION}}
    -X github.com/adrianliechti/donkey/internal/server.Version={{.VERSION}}
  # Images must match the cluster's nodes, which are this machine's.
  ARCH:
    sh: "case $(uname -m) in arm64|aarch64) echo arm64;; *) echo amd64;; esac"
  CLUSTER: donkey

tasks:
  default:
    desc: List available tasks
    silent: true
    cmds:
      - task --list

  build:
    desc: Build bin/donkey
    deps: [web-build]
    # No sources/generates fingerprint: it ignores VERSION, so a versioned
    # build would silently keep an older binary. Go's own build cache already
    # makes the repeat cost small.
    cmds:
      - go build -ldflags "{{.LDFLAGS}}" -o bin/{{.BINARY}} ./cmd/donkey

  install:
    desc: Install donkey into GOPATH/bin
    deps: [web-build]
    cmds:
      - go install -ldflags "{{.LDFLAGS}}" ./cmd/donkey

  web-build:
    desc: Build the admin console (embedded into donkey-server)
    dir: web
    cmds:
      - npm install --no-audit --no-fund
      - npm run build
    sources:
      - src/**/*
      - index.html
      - package.json
      - vite.config.ts
    generates:
      - dist/index.html

  web-dev:
    desc: "Console with live reload on :5173 — needs the API: kubectl -n donkey-system port-forward svc/donkey-server 8088:80"
    dir: web
    cmds:
      - npm install --no-audit --no-fund
      - npm run dev

  # image cross-compiles one command, wraps it in its Dockerfile and loads it
  # into the cluster. Both images donkey builds go through here.
  image:
    internal: true
    requires:
      vars: [CMD, BIN, IMAGE, DOCKERFILE, CONTEXT]
    cmds:
      - mkdir -p {{.CONTEXT}}
      - CGO_ENABLED=0 GOOS=linux GOARCH={{.ARCH}} go build -ldflags "{{.LDFLAGS}}" -o {{.CONTEXT}}/{{.BIN}} {{.CMD}}
      - cp {{.DOCKERFILE}} {{.CONTEXT}}/Dockerfile
      - docker build -q -t {{.IMAGE}} {{.CONTEXT}}
      # devkube pushes it into the in-cluster registry (registry.platform).
      - devkube --cluster {{.CLUSTER}} load {{.IMAGE}}

  server-image:
    desc: Build the donkey-server image and load it into the cluster registry
    deps: [web-build]
    cmds:
      - task: image
        vars:
          CMD: ./cmd/donkey-server
          # Dockerfile.server picks the binary by TARGETARCH, which a plain
          # build resolves to the daemon's own arch — this machine's.
          BIN: donkey-server-{{.ARCH}}
          IMAGE: '{{.IMAGE | default "donkey/donkey-server:dev"}}'
          DOCKERFILE: hack/Dockerfile.server
          CONTEXT: .build

  publish:
    desc: "Build the donkey-server image (amd64 + arm64) and push it to GHCR: task publish VERSION=0.2.0"
    # A precondition, not a dep: the version check runs before any work, so a
    # forgotten VERSION fails instantly.
    preconditions:
      - sh: '[ "{{.VERSION}}" != "dev" ]'
        msg: "publish needs a real version: task publish VERSION=0.2.0"
    vars:
      IMAGE: '{{.IMAGE | default "ghcr.io/adrianliechti/donkey-server"}}'
    cmds:
      # Needs a prior `docker login ghcr.io` (token with write:packages).
      - task: web-build
      - mkdir -p .build/publish
      - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags "{{.LDFLAGS}}" -o .build/publish/donkey-server-amd64 ./cmd/donkey-server
      - CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags "{{.LDFLAGS}}" -o .build/publish/donkey-server-arm64 ./cmd/donkey-server
      - cp hack/Dockerfile.server .build/publish/Dockerfile
      - docker buildx build --platform linux/amd64,linux/arm64 -t {{.IMAGE}}:{{.VERSION}} --push .build/publish

  demo-idp-image:
    desc: Build the DEMO fake identity provider image and load it into the cluster
    cmds:
      - task: image
        vars:
          CMD: ./hack/demo/fake-idp
          BIN: fake-idp
          IMAGE: '{{.IMAGE | default "donkey/fake-idp:dev"}}'
          DOCKERFILE: hack/demo/fake-idp/Dockerfile
          CONTEXT: .build/fake-idp

  test:
    desc: Run unit tests (no cluster or docker needed)
    cmds:
      - go test ./...

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  fmt:
    desc: Format the Go sources
    cmds:
      - gofmt -w cmd internal

  lint:
    desc: Lint the admin console
    dir: web
    cmds:
      - npm run lint

  check:
    desc: Everything CI would run — format check, vet, tests, console typecheck and lint
    cmds:
      - test -z "$(gofmt -l cmd internal)" || { echo "gofmt needed — run 'task fmt'"; gofmt -l cmd internal; exit 1; }
      - task: vet
      - task: test
      - cd web && npx tsc -b
      - task: lint

  demo:
    desc: "DEMO: create a local devkube cluster, install the full donkey stack (auto-login fake IdP) and deploy the demo app (dashboard + MCP backend)"
    cmds:
      - hack/demo.sh

  demo:cluster:
    desc: "DEMO 1/3: create the local devkube cluster with donkey's prerequisites (cert-manager, registry, Envoy Gateway)"
    cmds:
      - hack/cluster.sh

  demo:setup:
    desc: "DEMO 2/3: install donkey into the cluster — fake identity provider, CA, control plane"
    cmds:
      - hack/demo-setup.sh

  demo:app:
    desc: "DEMO 3/3: log in and deploy the demo app (dashboard + MCP backend); needs `devkube connect` running"
    cmds:
      - hack/demo-app.sh

  demo:samples:
    desc: "Deploy every testdata sample into one space and report which ones donkey got right on its own"
    cmds:
      - hack/demo-samples.sh

  demo:broken:
    desc: "Deploy the apps that are MEANT to fail, and check donkey explained each one and proposed a patch"
    cmds:
      - hack/demo-broken.sh

  e2e:
    desc: "End-to-end smoke test on devkube: install → login → deploy → certificate → gateway login → addon → env → spaces → storage → destroy"
    cmds:
      - hack/e2e.sh

  down:
    desc: Delete the local demo/e2e cluster
    cmds:
      - devkube --cluster {{.CLUSTER}} delete
