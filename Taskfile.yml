version: "3"

vars:
  BINARY: donkey
  VERSION: '{{.VERSION | default "dev"}}'
  # Both binaries carry the version: the CLI prints it, and the server hands
  # it back on /v1/ping so a CLI can tell it is talking to a different one.
  LDFLAGS: >-
    -X github.com/adrianliechti/donkey/internal/cli.version={{.VERSION}}
    -X github.com/adrianliechti/donkey/internal/server.Version={{.VERSION}}
  # Images must match the cluster's nodes, which are this machine's.
  ARCH:
    sh: "case $(uname -m) in arm64|aarch64) echo arm64;; *) echo amd64;; esac"
  CLUSTER: donkey

tasks:
  default:
    desc: List available tasks
    silent: true
    cmds:
      - task --list

  build:
    desc: Build bin/donkey
    deps: [web-build]
    # No sources/generates fingerprint: it ignores VERSION, so a versioned
    # build would silently keep an older binary. Go's own build cache already
    # makes the repeat cost small.
    cmds:
      - CGO_ENABLED=0 go build -ldflags "{{.LDFLAGS}}" -o bin/{{.BINARY}} ./cmd/donkey

  install:
    desc: Install donkey into GOPATH/bin
    deps: [web-build]
    cmds:
      - CGO_ENABLED=0 go install -ldflags "{{.LDFLAGS}}" ./cmd/donkey

  web-build:
    desc: Build the admin console (embedded into donkey-server)
    dir: web
    cmds:
      - npm install --no-audit --no-fund
      - npm run build
    sources:
      - src/**/*
      - index.html
      - package.json
      - vite.config.ts
    generates:
      - dist/index.html

  web-dev:
    desc: "Console with live reload on :5173 — needs the API: kubectl -n donkey-system port-forward svc/donkey-server 8088:80"
    dir: web
    cmds:
      - npm install --no-audit --no-fund
      - npm run dev

  # image cross-compiles the small pure-Go helper commands and wraps them in
  # their Dockerfiles. donkey-server has its own source-building Dockerfile
  # below because embedded DuckDB needs a native CGO toolchain per platform.
  image:
    internal: true
    requires:
      vars: [CMD, BIN, IMAGE, DOCKERFILE, CONTEXT]
    cmds:
      - mkdir -p {{.CONTEXT}}
      - CGO_ENABLED=0 GOOS=linux GOARCH={{.ARCH}} go build -ldflags "{{.LDFLAGS}}" -o {{.CONTEXT}}/{{.BIN}} {{.CMD}}
      - cp {{.DOCKERFILE}} {{.CONTEXT}}/Dockerfile
      - docker build -q -t {{.IMAGE}} {{.CONTEXT}}

  server-image:
    desc: Build the donkey-server image (into the local Docker daemon)
    cmds:
      - docker build -q -f hack/Dockerfile.server --build-arg VERSION={{.VERSION}} -t {{.IMAGE | default "donkey/donkey-server:dev"}} .

  server-image:kind:
    desc: Build the donkey-server image and load it into the kind cluster registry
    cmds:
      - task: server-image
      # devkube pushes it into the in-cluster registry (registry.platform).
      - devkube --cluster {{.CLUSTER}} load donkey/donkey-server:dev

  publish:
    desc: "Build the donkey-server image (amd64 + arm64) and push it to GHCR: task publish VERSION=0.2.0"
    # A precondition, not a dep: the version check runs before any work, so a
    # forgotten VERSION fails instantly.
    preconditions:
      - sh: '[ "{{.VERSION}}" != "dev" ]'
        msg: "publish needs a real version: task publish VERSION=0.2.0"
    vars:
      IMAGE: '{{.IMAGE | default "ghcr.io/adrianliechti/donkey-server"}}'
    cmds:
      # Needs a prior `docker login ghcr.io` (token with write:packages).
      - docker buildx build --platform linux/amd64,linux/arm64 -f hack/Dockerfile.server --build-arg VERSION={{.VERSION}} -t {{.IMAGE}}:{{.VERSION}} --push .

  machine-image:
    desc: Build the personal machine image — toolchains, the donkey CLI and the Wingman agent (into the local Docker daemon)
    cmds:
      - docker build -q -f hack/Dockerfile.machine --build-arg VERSION={{.VERSION}} -t {{.IMAGE | default "donkey/donkey-machine:dev"}} .

  machine-image:kind:
    desc: Build the personal machine image and load it into the kind cluster registry
    cmds:
      - task: machine-image
      - devkube --cluster {{.CLUSTER}} load donkey/donkey-machine:dev

  publish:machine:
    desc: "Build the personal machine image (amd64 + arm64) and push it to GHCR: task publish:machine VERSION=0.2.0"
    preconditions:
      - sh: '[ "{{.VERSION}}" != "dev" ]'
        msg: "publish needs a real version: task publish:machine VERSION=0.2.0"
    vars:
      IMAGE: '{{.IMAGE | default "ghcr.io/adrianliechti/donkey-machine"}}'
    cmds:
      - docker buildx build --platform linux/amd64,linux/arm64 -f hack/Dockerfile.machine --build-arg VERSION={{.VERSION}} -t {{.IMAGE}}:{{.VERSION}} --push .

  demo-idp-image:
    desc: Build the DEMO fake identity provider image (into the local Docker daemon)
    cmds:
      - task: image
        vars:
          CMD: ./hack/demo/fake-idp
          BIN: fake-idp
          IMAGE: '{{.IMAGE | default "donkey/fake-idp:dev"}}'
          DOCKERFILE: hack/demo/fake-idp/Dockerfile
          CONTEXT: .build/fake-idp

  demo-idp-image:kind:
    desc: Build the DEMO fake identity provider image and load it into the kind cluster registry
    cmds:
      - task: demo-idp-image
      - devkube --cluster {{.CLUSTER}} load donkey/fake-idp:dev

  private-packages-image:
    desc: Build the authenticated package mirror used by live E2E installs
    cmds:
      - task: image
        vars:
          CMD: ./hack/private-packages
          BIN: private-packages
          IMAGE: '{{.IMAGE | default "donkey/private-packages:dev"}}'
          DOCKERFILE: hack/private-packages/Dockerfile
          CONTEXT: .build/private-packages

  private-packages-image:kind:
    desc: Build and load the authenticated E2E package mirror into kind
    cmds:
      - task: private-packages-image
      - devkube --cluster {{.CLUSTER}} load donkey/private-packages:dev

  test:
    desc: Run unit tests (no cluster or docker needed)
    cmds:
      - go test ./...

  # How good is the builder? Three rungs, each costlier and more convincing
  # than the last: what donkey works out by reading, what the assistant writes,
  # and whether the result actually runs.
  #
  #   builder:detect   122 apps · no model · no builds · seconds
  #   builder:write     10 apps · model    · no builds · minutes
  #   demo:samples      19 apps · model    · real builds and deploys · ~20 min

  builder:corpus:
    desc: >-
      Fetch Railpack's example projects — 122 real apps, each with the build plan
      Railpack commits for it — into .build/corpus. The fixture builder:detect scores against.
    status:
      - test -d .build/corpus/railpack-main/examples
    cmds:
      - mkdir -p .build/corpus
      - curl -fsSL https://github.com/railwayapp/railpack/archive/refs/heads/main.tar.gz -o .build/corpus/railpack.tar.gz
      - tar -xzf .build/corpus/railpack.tar.gz -C .build/corpus
      - rm -f .build/corpus/railpack.tar.gz
      - echo "corpus ready — $(ls .build/corpus/railpack-main/examples | wc -l | tr -d ' ') example projects"

  builder:detect:
    desc: >-
      Score donkey's detection against Railpack's, app by app, over those 122.
      No model and no builds — the deterministic rung, and the number to watch
      when a detection rule changes.
    deps: [builder:corpus]
    cmds:
      - DONKEY_CORPUS={{.ROOT_DIR}}/.build/corpus/railpack-main go test ./internal/ai -run TestCorpus -v -count=1

  builder:write:
    desc: >-
      Have a real model write Dockerfiles for donkey's own testdata apps and check
      what comes back — no builds. Needs OPENAI_BASE_URL / OPENAI_API_KEY;
      set DONKEY_MODEL to pick the model (default claude-sonnet-5).
    cmds:
      - go test ./internal/ai -run TestLive -v -count=1 -timeout 20m

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  fmt:
    desc: Format the Go sources and the admin console (oxfmt, through Vite+)
    cmds:
      - gofmt -w cmd internal pkg e2e
      - cd web && npm run fmt

  lint:
    desc: Lint the admin console
    dir: web
    cmds:
      - npm run lint

  check:
    desc: Everything CI would run — format checks, vet, tests, console typecheck and lint
    cmds:
      - test -z "$(gofmt -l cmd internal pkg e2e)" || { echo "gofmt needed — run 'task fmt'"; gofmt -l cmd internal pkg e2e; exit 1; }
      - cd web && npm run fmt:check
      - task: vet
      # The e2e suite is behind a build tag — vet it too, or it rots.
      - go vet -tags e2e ./e2e
      - task: test
      - cd web && npx tsc -b
      - task: lint

  setup:kind:
    desc: "Create the local devkube/kind cluster with donkey's prerequisites (in-cluster registry)"
    cmds:
      - hack/setup-kind.sh

  install:kind:
    desc: "Install donkey into the kind cluster — fake identity provider, registry CA, control plane (needs setup:kind)"
    cmds:
      - hack/install-kind.sh

  install:docker:
    desc: "Install donkey straight onto the local Docker engine — no cluster; apps at https://<app>.<space>.apps.localhost"
    cmds:
      - hack/install-docker.sh

  verify:
    desc: "Run the Go e2e suite against the running kind installation (needs install:kind)"
    cmds:
      - hack/verify.sh kind

  verify:docker:
    desc: "Run the Go e2e suite against the running docker installation (needs install:docker)"
    cmds:
      - hack/verify.sh docker

  verify:builder:
    desc: Build all samples, repair cases and FastMCP with the live assistant; verify HTTP, persistence and MCP OAuth
    env:
      DONKEY_E2E_BUILDER: 'true'
      DONKEY_E2E_REPORTS: '{{.ROOT_DIR}}/.build/e2e'
    cmds:
      - hack/verify.sh {{.RUNTIME | default "kind"}} -run '^TestBuilder(Samples|Recovery|FastMCPOAuth)$' {{.CLI_ARGS}}

  verify:os-packages:
    desc: Install real Debian/Alpine packages through authenticated TLS mirrors in an isolated BuildKit (needs Docker and internet)
    env:
      DONKEY_E2E_OS_PACKAGES: 'true'
    cmds:
      - go test -tags e2e -count=1 -timeout 20m -v -run '^TestOSPackageMirrors$' ./internal/build

  verify:lockfiles:
    desc: Run real frozen installs (npm, yarn, bun, uv) from lockfiles written elsewhere, in an isolated BuildKit whose only way out is the package mirror (needs Docker and internet)
    env:
      DONKEY_E2E_LOCKFILES: 'true'
    cmds:
      - go test -tags e2e -count=1 -timeout 20m -v -run '^TestLockfilesInstallThroughTheMirror$' ./internal/build

  verify:scan:
    desc: "Vulnerability scan E2E against a disposable BuildKit in Docker: inventory, matching, rescan, doctor probes (pulls the scanner image and its database)"
    env:
      DONKEY_E2E_SCAN: 'true'
    cmds:
      - go test -tags e2e -count=1 -timeout 15m -v -run '^TestScan' ./internal/build

  verify:repair:
    desc: Repair a scan-refused recipe with a live model, then scan and start the repaired image in disposable BuildKit (needs Docker, internet and OPENAI_BASE_URL)
    env:
      DONKEY_E2E_REPAIR: 'true'
    cmds:
      - go test -tags e2e -count=1 -timeout 20m -v -run '^TestLiveScanRepair$' ./internal/server

  prepare:monorepos:
    desc: Fetch the pinned Google microservices-demo repository for live tests
    cmds:
      - hack/prepare-monorepos.sh

  verify:monorepos:
    desc: Deploy and exercise Google Online Boutique on the local Docker installation
    deps: [prepare:monorepos]
    env:
      DONKEY_E2E_GOOGLE: '{{.ROOT_DIR}}/.build/corpus/microservices-demo'
      DONKEY_E2E_REPORTS: '{{.ROOT_DIR}}/.build/e2e'
    cmds:
      - hack/verify.sh docker -run '^TestProjectGoogle$'

  verify:web:
    desc: Upload, review and deploy the two-app demo in Chromium, then exercise its services
    cmds:
      - hack/verify-web.sh

  verify:admin:
    desc: Exercise the PostgreSQL and Redis browsers and check service isolation between spaces
    cmds:
      - hack/verify-web.sh e2e/admin.mjs

  e2e:
    desc: "From nothing to verified: setup:kind + install:kind + the Go e2e suite"
    cmds:
      - hack/setup-kind.sh
      - hack/install-kind.sh
      - hack/verify.sh kind

  demo:
    desc: "DEMO: create a local devkube cluster, install the full donkey stack (auto-login fake IdP) and deploy the demo app (dashboard + MCP backend)"
    cmds:
      - hack/demo.sh

  demo:app:
    desc: "DEMO: log in and deploy the demo app (dashboard + MCP backend); needs install:kind and `devkube connect` running"
    cmds:
      - hack/demo-app.sh

  demo:samples:
    desc: "Deploy every testdata sample and require every one to build, start and become healthy"
    cmds:
      - hack/demo-samples.sh

  demo:broken:
    desc: "Deploy all four compatibility repair cases and require healthy applications"
    cmds:
      - hack/demo-broken.sh

  down:
    desc: Delete the local demo/e2e cluster
    cmds:
      - devkube --cluster {{.CLUSTER}} delete
