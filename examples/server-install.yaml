# Generated by: donkey server init --runtime kubernetes
# Keep credentials out of this file. server install reads them from
# DONKEY_REGISTRY_PASSWORD, DONKEY_OIDC_CLIENT_SECRET, OPENAI_API_KEY and EXA_API_KEY.

runtime: kubernetes
image: ghcr.io/example/donkey-server:latest

registry:
  url: registry.example.com/donkey
  username: ci

domain: apps.example.com

# Empty or omitted allows all registered offerings. A nonempty list makes
# these available in every space; space admins can add others in settings.
# commonOfferings: [postgres, redis, s3, openai, exa]

# Optional HTTP API offerings; apps use internal HTTP and the shared proxy
# uses its system CA store for HTTPS targets and outbound proxies.
# proxyServices:
#   - name: enterprise-api
#     description: Company API
#     targetUrl: https://api.corp.example/v1
#     proxyUrl: http://proxy.corp.example:3128

tls:
  mode: cert-manager
  issuerName: platform-ca

# Optional when external-dns runs with --source=crd and the gateway has a
# stable load-balancer VIP:
# gateway:
#   externalDNS:
#     targets: [10.0.0.10]

# Optional initial admins; omit to make the first signed-in user an admin.
# Later changes are made in Account → Platform settings.
# platform:
#   admins:
#     users: [owner@example.com]

auth:
  issuer: https://id.example.com
  clientId: donkey
  # Optional: donkey's own API, asked for on top of openid/profile/email.
  # Apps receive it as X-Forwarded-Access-Token; the Trino console sends
  # Authorization: Bearer to the add-on service for on-behalf-of delegation.
  # scope: api://<donkey-client-id>/<scope>

ai:
  baseUrl: https://api.openai.com/v1
  model: gpt-6.1-sol

# Optional: a development machine for everyone who builds here — toolchains,
# the donkey CLI and a coding agent, opened in the console. One per person,
# with a disk of its own. Naming the image turns machines on.
# machines:
#   image: ghcr.io/example/donkey-machine:latest
#   storage: 10Gi            # each machine's disk
#   cpu: "2"                 # the most one machine may use
#   memory: 4Gi
#   egress: restricted       # the package mirror, the model and donkey only;
#                            # open lets machines reach the network (a Git host)
#   idle: 60m                # unused this long, a machine stops and keeps its
#                            # disk; never leaves stopping to its owner

# Builds: every image is scanned for known vulnerabilities before it is
# pushed. The defaults below refuse critical findings that have a fix, let
# the assistant waive a refusal it reads as not affecting the app, and
# refuse credentials baked into images. A network without internet names
# the database mirrors (see README, "Restricted networks").
# build:
#   registryMirrors:
#     docker.io: https://registry.example.com/dockerhub
#     ghcr.io: https://registry.example.com/ghcr
#   scan:
#     block: critical          # none | critical | high
#     ignoreUnfixed: true
#     secrets: block           # block | warn | off
#     triage: assistant        # assistant | off
#     dbRepository: registry.example.com/ghcr/aquasecurity/trivy-db
#     javaDbRepository: registry.example.com/ghcr/aquasecurity/trivy-java-db

# Optional web search and page contents; credential from EXA_API_KEY.
# exa:
#   baseUrl: https://api.exa.ai

# The control plane's data volume (source history, one git repository per
# app), mounted into donkey-orchestrator: a 5Gi claim by default. To put it
# on storage of your choice, name a claim or shape donkey's:
# data:
#   existingClaim: donkey-data-nfs   # or storageClass: / size:
