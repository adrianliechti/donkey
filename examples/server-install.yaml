# Generated by: donkey server init --runtime kubernetes
# Keep credentials out of this file. server install reads them from
# DONKEY_REGISTRY_PASSWORD, DONKEY_OIDC_CLIENT_SECRET, OPENAI_API_KEY and EXA_API_KEY.

runtime: kubernetes
image: ghcr.io/example/donkey-server:latest

registry:
  url: registry.example.com/donkey
  username: ci

domain: apps.example.com

# Empty or omitted allows all registered offerings. A nonempty list makes
# these available in every space; space admins can add others in settings.
# commonOfferings: [postgres, redis, s3, openai, exa]

# Optional HTTP API offerings; apps use internal HTTP and the shared proxy
# uses its system CA store for HTTPS targets and outbound proxies.
# proxyServices:
#   - name: enterprise-api
#     description: Company API
#     targetUrl: https://api.corp.example/v1
#     proxyUrl: http://proxy.corp.example:3128

tls:
  mode: cert-manager
  issuerName: platform-ca

# Optional when external-dns runs with --source=crd and the gateway has a
# stable load-balancer VIP:
# gateway:
#   externalDNS:
#     targets: [10.0.0.10]

# Optional initial admins; omit to make the first signed-in user an admin.
# Later changes are made in Account → Platform settings.
# platform:
#   admins:
#     users: [owner@example.com]

auth:
  issuer: https://id.example.com
  clientId: donkey

ai:
  baseUrl: https://api.openai.com/v1
  model: gpt-5.6-sol

# Optional web search and page contents; credential from EXA_API_KEY.
# exa:
#   baseUrl: https://api.exa.ai
