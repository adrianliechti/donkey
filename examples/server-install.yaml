# Example settings for `donkey server install -f server-install.yaml`.
# The cluster must already exist; donkey brings its own edge (TLS, routing,
# login) — no ingress controller, no cert-manager.
# Secrets can come from env instead: DONKEY_REGISTRY_PASSWORD,
# DONKEY_OIDC_CLIENT_SECRET, OPENAI_API_KEY.

image: ghcr.io/example/donkey-server:latest

# The build engine. Defaults to a digest-pinned moby/buildkit; set it to your
# own mirror when the cluster can't reach Docker Hub.
# buildkitImage: registry.example.com/mirror/buildkit:v0.31.2

registry:
  url: registry.example.com/donkey
  username: ci
  # insecure: true            # plain-HTTP registries (testing only)
  # immutable: true           # the registry refuses to overwrite a tag (ECR
                              # tag immutability, GHCR immutable tags, a Harbor
                              # rule). Donkey then gives every image tag a
                              # random suffix, so two deploys of one commit in
                              # the same second can't collide on a push.

domain: example.com            # apps become <app>.<space>.example.com; the
                               # API, console and the one OAuth callback live
                               # on the domain itself. DNS needs *.example.com
                               # AND example.com (a wildcard covers any depth,
                               # but never the apex).

# serverHost: console.example.com
                               # moves the API + console off the apex; must be
                               # the domain or a name under it. The OAuth
                               # callback stays on the domain either way.

# gateway:
#   serviceType: ClusterIP     # how traffic enters the cluster. The default,
                               # LoadBalancer, is right wherever something
                               # assigns those an address (cloud, MetalLB).
                               # Clusters without that (kind, local demos)
                               # need ClusterIP or NodePort — an address-less
                               # LoadBalancer leaves every donkey hostname
                               # unroutable.
#   httpNodePort: 30080        # NodePort only: pin the node ports so port
#   httpsNodePort: 30443       # mappings and firewall rules can rely on them.

tls:
  # How the gateway gets its certificates. Apps are always served over https
  # (the login gateway's cookies are Secure-only); the gateway issues the
  # certificates itself — no cert-manager.
  mode: acme                  # one certificate per hostname from
                              # Let's Encrypt, requested on demand; the
                              # gateway must be reachable on ports 80/443.
  email: you@example.com      # ACME account contact (expiry notices)
  # directory: https://acme-staging-v02.api.letsencrypt.org/directory
                              # while experimenting (rate limits)
  # mode: ca                  # or: a built-in CA for internal installs —
                              # export & trust its one certificate:
                              # kubectl -n donkey-system get secret \
                              #   donkey-gateway-ca -o jsonpath='{.data.ca\.crt}' | base64 -d
  # mode: static              # or: bring your own (wildcard) certificate
  # secret: donkey-gateway-tls  # kubernetes.io/tls Secret in donkey-system

auth:
  # A real OIDC provider — Pocket ID, Entra ID, Keycloak, anything OIDC.
  # Required: it is the one way in — apps, the admin console and the CLI all
  # sign in against it. Register ONE callback URL:
  # https://<domain>/oauth2/callback — every login under the domain rides
  # through it, and one sign-in covers everything (the session cookie lives
  # on the domain). Only apps with a custom domain outside it need their own
  # callback registered.
  issuer: https://id.example.com
  clientId: <client-id>
  # clientSecret: …           # better: DONKEY_OIDC_CLIENT_SECRET env
  # admins:                   # who may use the console and CLI — matched
  #   users: [you@example.com]  # like an app's `access` rules. Empty means
  #   groups: [platform]        # everyone the IdP admits may administer.

ai:
  # Required: donkey reads every app with its assistant. Any
  # OpenAI-compatible endpoint, reachable FROM the cluster. Source summaries
  # of your apps go here, so point it at a model you trust.
  baseUrl: https://api.openai.com/v1
  model: gpt-5.5
  # apiKey: …                 # better: OPENAI_API_KEY env
