# Example settings for `donkey server install -f server-install.yaml`.
# The cluster (with Envoy Gateway installed) must already exist.
# Secrets can come from env instead: DONKEY_REGISTRY_PASSWORD,
# DONKEY_OIDC_CLIENT_SECRET, OPENAI_API_KEY.

image: ghcr.io/example/donkey-server:latest

registry:
  url: registry.example.com/donkey
  username: ci
  # insecure: true            # plain-HTTP registries (testing only)

baseDomain: apps.example.com   # apps become <app>.<space>.apps.example.com

tls:
  # Required. Apps are always served over https (the login gateway's cookies
  # are Secure-only) and cert-manager issues one certificate per app
  # hostname — so any solver works, HTTP-01 included.
  issuer: letsencrypt-prod
  # kind: ClusterIssuer       # or Issuer (in donkey-system)

auth:
  # A real OIDC provider — e.g. Entra ID. Leave the whole block out to run
  # without a login gateway (apps are then public).
  issuer: https://login.microsoftonline.com/<tenant-id>/v2.0
  clientId: <application-client-id>
  # clientSecret: …           # better: DONKEY_OIDC_CLIENT_SECRET env

ai:
  # Required: donkey reads every app with its assistant. Any
  # OpenAI-compatible endpoint, reachable FROM the cluster. Source summaries
  # of your apps go here, so point it at a model you trust.
  baseUrl: https://api.openai.com/v1
  model: gpt-5.5
  # apiKey: …                 # better: OPENAI_API_KEY env
