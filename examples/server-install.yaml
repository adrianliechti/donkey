# Example settings for `donkey server install -f server-install.yaml`.
# The cluster must already exist; donkey brings its own edge (TLS, routing,
# login) — no ingress controller or cert-manager required. appGateway below
# can opt into a platform's Gateway API and cert-manager installation.
# Secrets can come from env instead: DONKEY_REGISTRY_PASSWORD,
# DONKEY_OIDC_CLIENT_SECRET, OPENAI_API_KEY.

image: ghcr.io/example/donkey-server:latest

# The build engine. Defaults to a digest-pinned moby/buildkit; set it to your
# own mirror when the cluster can't reach Docker Hub.
# buildkitImage: registry.example.com/dockerhub/moby/buildkit:v0.31.2

# Managed addons are pulled by the cluster/runtime, not during an app build,
# so build.registryMirrors cannot redirect them. Values are repositories only;
# donkey appends the configured addon version. When these paths share the host
# of registry.url, the same registry credentials are used for their pulls.
# addonImages:
#   postgres: registry.example.com/dockerhub/library/postgres
#   rustfs: registry.example.com/dockerhub/rustfs/rustfs

# Kubernetes only: existing image-pull Secrets for managed addon pods. Each
# name must exist in every workload namespace where an addon can run. When
# configured, these replace the pull secret derived from registry credentials;
# donkey references them without reading or copying their contents.
# addonImagePullSecrets:
#   - registry-example-com

registry:
  url: registry.example.com/donkey
  username: ci
  # insecure: true            # plain-HTTP registries (testing only)
  # immutable: true           # the registry refuses to overwrite a tag (ECR
                              # tag immutability, GHCR immutable tags, a Harbor
                              # rule). Donkey then gives every image tag a
                              # random suffix, so two deploys of one commit in
                              # the same second can't collide on a push.

domain: example.com            # apps become <app>.<space>.example.com; the
                               # API, console and the one OAuth callback live
                               # on the domain itself. DNS needs *.example.com
                               # AND example.com (a wildcard covers any depth,
                               # but never the apex).

# serverHost: console.example.com
                               # moves the API + console off the apex; must be
                               # the domain or a name under it. The OAuth
                               # callback stays on the domain either way.

# kubernetes:
#   # Which namespaces donkey uses — and, by leaving these empty, which ones
#   # it creates. One rule for both: name a namespace and it is yours. donkey
#   # expects it to exist, applies into it, and never creates, deletes or
#   # relabels it. Leave it empty and donkey makes and manages its own.
#   system:
#     namespace: bank-donkey-system
#                               # where the control plane lives. It is also
#                               # the installation's identity, so a second
#                               # donkey on the same cluster MUST set this to
#                               # something else — otherwise the two would
#                               # apply the same cluster-scoped RBAC and the
#                               # first would lose its permissions.
#                               # Must allow privileged pods: the build engine
#                               # is one (pod-security.kubernetes.io/enforce=
#                               # privileged, or no enforcement at all).
#   workload:
#     namespace: bank-donkey-apps
#                               # ONE namespace for every app of every space.
#                               # This is the answer for a cluster where you
#                               # cannot create namespaces: donkey then needs
#                               # no cluster-scoped permission at all — two
#                               # namespaced Roles and nothing else, no
#                               # cluster-admin.
#                               #
#                               # Apps are named <space>--<app> on the cluster
#                               # (one namespace holds one Service called
#                               # "api"), so siblings reach each other at
#                               # http://<space>--<app> rather than http://<app>
#                               # — addon bindings follow automatically.
#                               # Space and app names may not contain "--",
#                               # and together must stay within 63 characters.
#                               # Must not enforce the "restricted" policy:
#                               # most real images run as root.
#     # namespacePrefix: donkey-
#                               # Only when `namespace` above is NOT set: each
#                               # space gets <prefix><space> of its own, made
#                               # and deleted by donkey. Two installations
#                               # that both work this way need different
#                               # prefixes.

# gateway:
#   serviceType: ClusterIP     # how traffic enters the cluster. The default,
                               # LoadBalancer, is right wherever something
                               # assigns those an address (cloud, MetalLB).
                               # Clusters without that (kind, local demos)
                               # need ClusterIP or NodePort — an address-less
                               # LoadBalancer leaves every donkey hostname
                               # unroutable.
#   httpNodePort: 30080        # NodePort only: pin the node ports so port
#   httpsNodePort: 30443       # mappings and firewall rules can rely on them.
#
#   httpRoute:                 # OR: enter through a Gateway API gateway the
#     name: shared-gateway     # cluster already runs — donkey renders one
#     namespace: infra         # HTTPRoute for <domain> and *.<domain> whose
#     # sectionName: https     # backend is the donkey gateway. Its edge
#                              # Service then stays ClusterIP, and because
#                              # the cluster gateway terminates TLS before
#                              # routes match, pair this with `tls.mode: none`.
#                              # Custom app hostnames outside the domain are
#                              # not covered by this route.
#
#   appGateway:                # OR/ALSO: one Gateway, HTTPRoute and
#     className: private-edge  # cert-manager Certificate per exposed app.
#     issuerName: company-pki  # Objects live in kubernetes.system.namespace;
#     # issuerKind: ClusterIssuer
#     # issuerGroup: cert-manager.io
#     # routeNamespace: infra  # Only for a platform that mirrors each Gateway
#                              # (and makes its TLS Secret available) in infra.
#                              # The donkey-server ServiceAccount receives
#                              # namespaced rights in the system namespace,
#                              # never rights in infra.

tls:
  # How donkey's own gateway gets its certificates. Apps are always served over https
  # (the login gateway's cookies are Secure-only); the gateway issues the
  # certificates itself; appGateway has separate cert-manager issuer settings.
  mode: acme                  # one certificate per hostname from
                              # Let's Encrypt, requested on demand; the
                              # gateway must be reachable on ports 80/443.
  email: you@example.com      # ACME account contact (expiry notices)
  # directory: https://acme-staging-v02.api.letsencrypt.org/directory
                              # while experimenting (rate limits)
  # mode: ca                  # or: a built-in CA for internal installs —
                              # export & trust its one certificate:
                              # kubectl -n donkey-system get secret \
                              #   donkey-gateway-ca -o jsonpath='{.data.ca\.crt}' | base64 -d
  # mode: none                # or: no TLS at donkey's edge — only sensible
  #                           # behind gateway.httpRoute, where the cluster's
  #                           # gateway terminates TLS with certificates the
  #                           # platform provides (cert-manager, a PKI
  #                           # process — its concern, not donkey's).

# build:
#   # How an app with no Dockerfile gets built. A Dockerfile in the app folder
#   # always wins; so does one donkey wrote earlier (.donkey/Dockerfile), and
#   # so does a donkey.yaml with an explicit build.type.
#   #
#   #   railpack  (default) detects the app in donkey-server and plans the
#   #             build. It resolves package versions by calling out to
#   #             github.com, so it needs egress — a registry mirror alone is
#   #             not enough (see "Restricted networks" below).
#   #   ai        donkey's own: the assistant writes the app's Dockerfile,
#   #             donkey builds it and runs the result to check it starts.
#   #             The only things pulled are the base images the Dockerfile
#   #             names, which registryMirrors covers — so this works on a
#   #             network whose only egress is a mirror.
#   builder: ai
#
#   ai:
#     # donkey runs every image it builds before publishing it: it starts the
#     # container and waits for the app to listen on the port it will be
#     # deployed with. An image whose process exits fails the deploy, and the
#     # failure goes back to the assistant to write a better Dockerfile.
#     #
#     # An app that is still running but not yet listening PASSES — otherwise
#     # anything that opens a database on startup would fail here, where there
#     # is no database, and be "fixed" by a model with nothing to fix.
#     verify: true
#     verifySeconds: 45        # how long the app gets to come up
#     attempts: 3              # first Dockerfile plus two revisions
#
#   railpack:
#     # The two images railpack's plans reference; mirror them for a cluster
#     # that can't reach ghcr.io.
#     # builderImage: registry.example.com/mirror/railwayapp/railpack-builder:mise-2026.7.11
#     # runtimeImage: registry.example.com/mirror/railwayapp/railpack-runtime:mise-2026.7.11
#     #
#     # railpack also resolves package versions by running mise, which it
#     # downloads from github.com the first time (through the proxy below, if
#     # there is one). donkey's image does not carry a copy — it is 90 MB and
#     # only railpack wants it. To avoid that download, mount your own and set
#     # DONKEY_MISE_BINARY on donkey-server; donkey then stages it where
#     # railpack looks, as a shim that re-injects the proxy and any MISE_*
#     # from build.env. `donkey doctor` reports which of the two is in play.
#
#   ### Restricted networks ###
#   #
#   # Extra instructions for the Dockerfile-writing assistant. Use this for
#   # installation-specific constraints the source tree cannot reveal, such
#   # as the base-image prefixes published by your enterprise registry. This
#   # text is sent to the configured model; never put credentials in it.
#   instructions: |
#     Use base images only from registry.example.com/dockerhub or /ghcr.
#     Docker Hub official images are under registry.example.com/dockerhub/library/.
#
#   # registryMirrors is written into the build engine's configuration, so it
#   # covers every image a build pulls: the railpack images above, and every
#   # FROM in a Dockerfile — the app's own or one donkey wrote. Keys are
#   # upstream registry hosts; a scheme is optional. Mirror hosts inherit
#   # registry.caSecret. A mirror on the registry.url host also reuses its
#   # credentials; an unrelated host must allow anonymous pulls.
#   #
#   # Note that buildkitImage (above) is pulled by the cluster itself, not by
#   # the build engine — mirror that one by setting it directly.
#   registryMirrors:
#     docker.io: https://registry.example.com/dockerhub
#     ghcr.io: https://registry.example.com/ghcr
#
#   # env reaches every build step of every app — donkey layers it under the
#   # app's own build.env, so a project that pins its own registry still wins.
#   # This is where package managers are pointed at their mirrors.
#   env:
#     NPM_CONFIG_REGISTRY: https://artifactory.example.com/api/npm/npm
#     PIP_INDEX_URL: https://artifactory.example.com/api/pypi/pypi/simple
#     GOPROXY: https://artifactory.example.com/api/go/go
#
#   # A forward proxy for donkey's own components — the server, the build
#   # engine, and the gateway (which needs it for the OIDC token exchange and
#   # for ACME). The app's build steps read env, above. donkey adds its own
#   # cluster addresses and its registry to noProxy on top of what you write.
#   # With a proxy, railpack's version resolution works too; without one,
#   # choose builder: ai.
#   proxy:
#     https: http://proxy.example.com:3128
#     noProxy: .example.com,10.0.0.0/8,.svc.cluster.local

auth:
  # A real OIDC provider — Pocket ID, Entra ID, Keycloak, anything OIDC.
  # Required: it is the one way in — apps, the admin console and the CLI all
  # sign in against it. Register ONE callback URL:
  # https://<domain>/oauth2/callback — every login under the domain rides
  # through it, and one sign-in covers everything (the session cookie lives
  # on the domain). Only apps with a custom domain outside it need their own
  # callback registered.
  issuer: https://id.example.com
  clientId: <client-id>
  # clientSecret: …           # better: DONKEY_OIDC_CLIENT_SECRET env
  # admins:                   # who may use the console and CLI — matched
  #   users: [you@example.com]  # like an app's `access` rules. Empty means
  #   groups: [platform]        # everyone the IdP admits may administer.

ai:
  # Required: donkey reads every app with its assistant. Any
  # OpenAI-compatible endpoint, reachable FROM the cluster. Source summaries
  # of your apps go here, so point it at a model you trust.
  baseUrl: https://api.openai.com/v1
  model: gpt-5.5
  # apiKey: …                 # better: OPENAI_API_KEY env
