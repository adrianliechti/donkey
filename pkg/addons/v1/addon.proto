syntax = "proto3";

package donkey.addons.v1;

option go_package = "github.com/adrianliechti/donkey/pkg/addons/v1;addonv1";

// A plugin owns its backing resources; Donkey owns app bindings and egress.
// Provision and Deprovision must be idempotent for an Instance's identity.
service AddonPlugin {
  rpc Describe(DescribeRequest) returns (DescribeResponse);
  // Return only once the service is ready for connections. A deadline or a
  // lost response may cause Donkey to repeat this request.
  rpc Provision(ProvisionRequest) returns (ProvisionResponse);
  rpc Deprovision(DeprovisionRequest) returns (DeprovisionResponse);
}

message DescribeRequest {}

message DescribeResponse {
  string type = 1;
  string title = 2;
  string description = 3;
  string default_version = 4;
  string default_storage = 5;
  // The environment contract, used by the catalog without provisioning.
  repeated string env_keys = 6;
  // Application protocol used by clients and the console: postgres, mysql
  // (including MariaDB), redis, s3, openai, or a custom lowercase name.
  string protocol = 7;
}

message Instance {
  // Together, installation, space and name identify an instance. Namespace
  // describes the consumers, not where the plugin must create its service.
  string installation = 1;
  string space = 2;
  string name = 3;
  string runtime = 4; // "kubernetes" or "docker"
  string namespace = 5;
  // Kubernetes labels selecting this space's consumers. A plugin may use
  // these with namespace to admit clients in its own ingress policy.
  map<string, string> consumer_labels = 6;
}

message ProvisionRequest {
  Instance instance = 1;
  string version = 2;
  string storage = 3;
}

message ProvisionResponse {
  // These values (including credentials) are injected into attached apps.
  map<string, string> env = 1;
  // Connection URLs are explicit metadata, never inferred from env values.
  repeated string urls = 2;
  // Every destination an app needs. URLs alone cannot express a portable
  // Kubernetes NetworkPolicy. Specify pods or CIDRs when egress is fenced.
  repeated Endpoint endpoints = 3;
  // Defaults to Describe.protocol; if both are set they must agree.
  // This is distinct from Endpoint.protocol, which describes TCP/UDP/SCTP.
  string protocol = 4;
}

message Endpoint {
  string host = 1; // DNS name or IP, without a scheme or port
  int32 port = 2; // port the client dials
  string protocol = 3; // "TCP" (also the default), "UDP", or "SCTP"
  // Exactly one network destination may be supplied. Kubernetes services
  // should use pod labels, not their ClusterIP (translation is CNI-specific).
  KubernetesTarget kubernetes = 4;
  repeated string cidrs = 5; // external, stable IP ranges; no DNS snapshots
}

message KubernetesTarget {
  string namespace = 1;
  map<string, string> pod_labels = 2; // must not be empty
  // The pod port after Service translation; zero means Endpoint.port.
  int32 port = 3;
}

message DeprovisionRequest {
  Instance instance = 1;
  // Stop the service but retain data AND the credentials needed to reuse it.
  bool keep_data = 2;
}

message DeprovisionResponse {}
