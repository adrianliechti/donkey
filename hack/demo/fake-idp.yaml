# DEMO ONLY — a trivial auto-approving OIDC provider (see fake-idp/main.go).
# Applied by hack/demo.sh / hack/e2e.sh, never by donkey itself.
# Real installations point donkey at a real OIDC provider (e.g. Entra ID).
#
# Its issuer is its own Kubernetes service name — auth.donkey-identity — and
# that single choice is what lets the demo run without touching cluster DNS:
# Envoy resolves the issuer natively from inside the cluster, while
# `devkube connect` puts the very same name into your hosts file, so the
# browser follows the same URL.
#
# The namespace donkey-identity must NOT be donkey-<space> of any space the
# demo deploys: spaces map to donkey-<space> namespaces, and donkey refuses
# to deploy into a namespace it didn't create (so the space "identity" is
# unusable on demo clusters — the error message says why).
apiVersion: v1
kind: Namespace
metadata:
  name: donkey-identity
  labels:
    app.kubernetes.io/managed-by: donkey-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fake-idp
  namespace: donkey-identity
  labels:
    app: fake-idp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fake-idp
  template:
    metadata:
      labels:
        app: fake-idp
    spec:
      containers:
        - name: fake-idp
          image: registry.platform/donkey/fake-idp:dev
          imagePullPolicy: Always
          env:
            - name: ISSUER
              value: http://auth.donkey-identity
          ports:
            - containerPort: 8080
---
# Named "auth" because the service name doubles as the issuer URL users see.
apiVersion: v1
kind: Service
metadata:
  name: auth
  namespace: donkey-identity
spec:
  selector:
    app: fake-idp
  ports:
    - port: 80
      targetPort: 8080
