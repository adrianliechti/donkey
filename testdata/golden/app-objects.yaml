apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    donkey.local/image: reg.example.com/donkey/shop:abc123-20260101000000
  labels:
    app.kubernetes.io/component: web
    app.kubernetes.io/instance: acme--shop
    app.kubernetes.io/managed-by: donkey
    app.kubernetes.io/name: shop
    app.kubernetes.io/part-of: acme
    app.kubernetes.io/version: abc123-20260101000000
    donkey.local/app: shop
    donkey.local/space: acme
  name: shop
  namespace: donkey-acme
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/component: web
      donkey.local/app: shop
      donkey.local/space: acme
  strategy: {}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: web
        app.kubernetes.io/instance: acme--shop
        app.kubernetes.io/managed-by: donkey
        app.kubernetes.io/name: shop
        app.kubernetes.io/part-of: acme
        app.kubernetes.io/version: abc123-20260101000000
        donkey.local/app: shop
        donkey.local/space: acme
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        - name: PORT
          value: "8000"
        - name: APP_MODE
          value: prod
        - name: LOG_LEVEL
          value: info
        envFrom:
        - secretRef:
            name: shop-env
            optional: true
        - secretRef:
            name: shop-addon-db
        image: reg.example.com/donkey/shop:abc123-20260101000000
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8000
          periodSeconds: 15
        name: web
        ports:
        - containerPort: 8000
          name: http
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8000
        resources:
          limits:
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - NET_RAW
          seccompProfile:
            type: RuntimeDefault
        startupProbe:
          failureThreshold: 48
          httpGet:
            path: /healthz
            port: 8000
          periodSeconds: 5
      imagePullSecrets:
      - name: shop-registry
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/component: web
    app.kubernetes.io/instance: acme--shop
    app.kubernetes.io/managed-by: donkey
    app.kubernetes.io/name: shop
    app.kubernetes.io/part-of: acme
    donkey.local/app: shop
    donkey.local/space: acme
  name: shop
  namespace: donkey-acme
spec:
  ports:
  - name: http
    port: 80
    targetPort: 8000
  selector:
    app.kubernetes.io/component: web
    donkey.local/app: shop
    donkey.local/space: acme
  type: ClusterIP
status:
  loadBalancer: {}
---
apiVersion: v1
kind: ConfigMap
metadata:
  annotations:
    donkey.local/backend: http://shop.donkey-acme.svc:80
    donkey.local/host: shop.acme.apps.example.com
    donkey.local/login: required
    donkey.local/path: /
  labels:
    app.kubernetes.io/component: route
